<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.L.E.N.G — Оформление заказа</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

<div class="menu-overlay" id="menuOverlay"></div>
<div class="side-menu" id="sideMenu">
    <div class="menu-header">
        <h3>Каталог</h3>
        <button class="close-menu" id="closeMenuBtn">Назад</button>
    </div>
    <ul class="menu-list">
        <li><button data-category="upper">Верхняя одежда</button></li>
        <li><button data-category="lower">Нижняя одежда</button></li>
        <li><button data-category="accessories">Аксессуары</button></li>
        <li><button data-category="sets">Комплекты</button></li>
        <li><button data-category="slengitems">S.L.E.N.G ITEMS</button></li>
        <li><button class="collection-disabled" disabled>S.L.E.N.G COLLECTION</button></li>
        <li><button class="archive-btn disabled" disabled>Архив</button></li>
        <li><button class="crooked-menu-btn" id="aboutMenuBtn">О нас</button></li>
    </ul>
</div>

<div class="main-content">
    <!-- Хедер -->
    <header>
        <button class="burger-btn" id="burgerBtn">☰</button>
        <a href="index.html" class="logo-link">
            <img src="SLENG (черный).png" alt="S.L.E.N.G" class="logo-img logo-normal">
            <img src="SLENGEMO.png" alt="S.L.E.N.G EMO" class="logo-img logo-emo" style="display: none;">
        </a>
        <button class="cart-btn cart-link">
            <span class="cart-text">Корзина</span>
            <span id="cartCount">0</span>
        </button>
    </header>

    <div class="checkout-container" id="checkoutContainer">
        <div class="checkout-column">
            <h2 class="checkout-section-title">Контактные данные</h2>
            <div class="checkout-form-group">
                <label>Ваше ФИО *</label>
                <input type="text" id="fullName" placeholder="Иванов Иван Иванович">
            </div>
            <div class="checkout-form-group">
                <label>Контактный телефон *</label>
                <input type="tel" id="phone" placeholder="+7 999 123 45 67">
            </div>
            <div class="checkout-form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="chelkrutoi@mail.ru">
            </div>

            <h2 class="checkout-section-title" style="margin-top: 32px;">Доставка</h2>
            <div class="checkout-form-group">
                <label>Адрес пункта выдачи СДЭК</label>
                <input type="text" id="address" placeholder="Электродная улица, 9, Москва">
            </div>

            <div class="checkout-form-group promo-group">
                <label>Промокод (если есть)</label>
                <div class="promo-input-group">
                    <input type="text" id="promocode" placeholder="PromoSLENG1">
                    <button id="applyPromoBtn">Применить</button>
                </div>
            </div>
        </div>

        <div class="checkout-column">
            <div class="order-summary">
                <h2 class="checkout-section-title">Ваш заказ</h2>
                <div class="order-items" id="orderItems"></div>
                <div class="order-subtotal">
                    <span>Сумма товара:</span>
                    <span id="subtotal">0 ₽</span>
                </div>
                <div class="order-delivery">
                    <span>Доставка:</span>
                    <span id="deliveryCost">240 ₽</span>
                </div>
                <div class="order-total">
                    <span>Итог:</span>
                    <span id="totalPrice">0 ₽</span>
                </div>
                <button class="checkout-pay-btn" id="submitOrderBtn">Оплатить заказ</button>
                
                <!-- Чекбокс согласия -->
                <div class="checkout-agreement">
                    <label style="display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; flex-wrap: wrap;">
                        <input type="checkbox" id="agreeCheckbox" style="width: 18px; height: 18px; cursor: pointer;">
                        <span style="font-size: 12px; color: #888; letter-spacing: -0.3px; line-height: 1.4;">
                            нажав кнопку "Оплатить заказ" я принимаю условия 
                            <a href="offer.html" target="_blank" style="color: #888; text-decoration: underline;">публичной оферты</a>, 
                            <a href="privacy.html" target="_blank" style="color: #888; text-decoration: underline;">политики конфиденциальности</a> и 
                            <a href="privacy.html" target="_blank" style="color: #888; text-decoration: underline;">обработки персональных данных</a>
                        </span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer>
        <div class="footer-col">
            <button class="footer-btn" id="socialTrigger">Соц сети ▼</button>
            <div class="social-dropdown-menu" id="socialMenu">
                <a href="https://www.tiktok.com/@sleng444?_r=1&_t=ZN-96V1DmarOHi" target="_blank" class="social-link">TikTok</a>
                <a href="https://www.instagram.com/savelifeenergynewgeneration?igsh=MTZweHlod3pjZm05eA%3D%3D&utm_source=qr" target="_blank" class="social-link">Instagram</a>
                <a href="https://t.me/SLENG4" target="_blank" class="social-link">Telegram</a>
            </div>
        </div>
        <div class="footer-col">
            <button class="footer-btn" data-footer="about">О нас</button>
        </div>
        <div class="footer-col">
            <button class="footer-btn" data-footer="contact">Свяжись с нами</button>
        </div>
        <div class="footer-col">
            <button class="footer-btn" data-footer="offer">Публичная оферта</button>
        </div>
        <div class="footer-col">
            <button class="footer-btn" data-footer="privacy">Политика конфиденциальности</button>
        </div>
    </footer>
</div>

<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h2 class="cart-title">Ваша корзина</h2>
        <button class="cart-close" id="closeCartBtn">закрыть</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
        <div class="cart-total">Итого: <span id="cartTotal">0 ₽</span></div>
        <button class="cart-checkout-btn" id="checkoutBtn">Оформить заказ</button>
    </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="orders-db.js"></script>
<script src="script.js"></script>
<script src="checkout.js"></script>

<script>
    // Дополнительная инициализация для футера
    if(document.getElementById('socialTrigger')) {
        document.getElementById('socialTrigger').addEventListener('click', function(e){
            var menu = document.getElementById('socialMenu');
            if(menu) menu.classList.toggle('open');
        });
    }
</script>
</body>
</html>
